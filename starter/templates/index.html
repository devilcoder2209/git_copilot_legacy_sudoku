<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>

<body>
  <div class="header-controls" style="display: flex; justify-content: space-between; padding: 10px 20px;">
    <button id="theme-toggle">Toggle Dark Mode</button>
    <div id="timer" style="font-size: 20px; font-weight: bold;">Time: 00:00</div>
  </div>
  <h1>Sudoku Game</h1>
  
  <div class="game-settings" style="margin-bottom: 15px;">
    <label for="difficulty" style="font-size: 18px;">Difficulty:</label>
    <select id="difficulty" style="font-size: 16px; padding: 5px;">
      <option value="easy">Easy</option>
      <option value="medium" selected>Medium</option>
      <option value="hard">Hard</option>
    </select>
  </div>

  <div id="sudoku-board"></div>
  
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint-btn">Hint</button>
    <button id="check-solution">Check Solution</button>
    <div id="message" style="margin-top:10px;"></div>
  </div>
  <div id="leaderboard-container"></div>
  <script src="/static/main.js"></script>
</body>

</html>
